[project]
name = "sim2real"
version = "0.1.0"
description = "Sim2Real Transfer Learning for Nanobody Thermal Stability Prediction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0,<2.7",
    "transformers>=4.30",
    "datasets>=2.14",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "safetensors>=0.4",
    "numpy>=1.24,<2.0",
    "tqdm>=4.65",
    "accelerate>=1.1.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "jupyter>=1.0",
]

[project.scripts]
train = "ESM:main"
eval = "pLM523:main"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
name = "pytorch-cu124"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
