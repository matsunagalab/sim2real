stage_order:
  - reported-results
  - summaries
  - figures

stages:
  reported-results:
    - name: frozen encoder, Tm labels only
      type: prepare
      env: {DETACH_AUX_ENCODER: "true"}
      outputs: [results/final_tm_frozen/scaling.json]
      args:
        - --train-mode
        - mtl
        - --selection-scope
        - tm
        - --final-eval-split
        - test
        - --encoder-mode
        - frozen
        - --ddg-source
        - none
        - --n-ddg-list
        - 20
        - --model-arch
        - latent
        - --learning-rate
        - 0.001
        - --dropout-rate
        - 0.05
        - --weight-decay
        - 0.1
        - --n-runs
        - 5
        - --exp-name
        - final_tm_frozen

    - name: fine-tuned encoder, Tm labels only
