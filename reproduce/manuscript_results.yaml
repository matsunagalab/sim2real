  # ---------------------------------------------------------------- Fig. 2 ---
  # One pre-specified protocol shared by both designs (no per-source tuning):
  # 8 subset draws x 3 model-initialization seeds, label counts 20,80,160,320.
  # DESIGN_DATA_DIR is set explicitly here even though it is also the harness
  # default, so the pool these results come from is visible in this file. Pointing
  # it at the older data/source_labels/md_design/ moves the MAEs by up to ~0.1
  # degree without any error, because both directories use the same file names.
  data-design:
    - name: Fig. 2 baseline, frozen encoder, Tm labels only
      type: command
      env:
        DESIGN_DATA_DIR: data/source_labels/md_design_aligned
        CUDA_VISIBLE_DEVICES: "{first_gpu}"
      command: [uv, run, python, scripts/run_design_comparison.py, run,
                --source, none, --encoder-mode, frozen,
                --exp-name, design_tmonly_frozen]
      outputs: [results/design_tmonly_frozen/design.json]

    - name: Fig. 2 baseline, fine-tuned encoder, Tm labels only
      type: command
      env:
        DESIGN_DATA_DIR: data/source_labels/md_design_aligned
        CUDA_VISIBLE_DEVICES: "{first_gpu}"
      command: [uv, run, python, scripts/run_design_comparison.py, run,
                --source, none, --encoder-mode, hot,
                --exp-name, design_tmonly_hot]
      outputs: [results/design_tmonly_hot/design.json]

