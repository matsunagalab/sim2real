# Reproduce the selected configurations reported in the current manuscript.
# Raw MD, FEP, Rosetta, and ThermoMPNN calculations are not launched here;
# their processed tables are fixed inputs. The earlier candidate searches are
# documented in the tracked supplementary tables and are not repeated here.

fixed_inputs:
  # Experimental target split used in this study: 57 train / 114 validation /
  # 396 held-out test examples.
  - data/nbbench/train.csv
  - data/nbbench/val.csv
  - data/nbbench/test.csv

  # Processed source labels used by the selected final runs.
  - data/source_labels/MANIFEST.tsv
  - data/source_labels/fep/fep1mel_435_processed.csv
  - data/source_labels/fep/fep4idl_409_processed.csv
  - data/source_labels/fep/PROVENANCE.tsv
  - data/source_labels/md_fep400k/1mel_mdq_processed.csv
  - data/source_labels/md_fep400k/4idl_mdq_processed.csv
  - data/source_labels/rosetta/measured/1mel_rosettaddg_processed.csv
  - data/source_labels/rosetta/measured/4idl_rosettaddg_processed.csv
  - data/source_labels/thermompnn/1melMPNN2_processed.csv
  - data/source_labels/thermompnn/4idlMPNN2_processed.csv
  - data/source_labels/rosetta/random1000/random_2mut_1mel_1000_with_ddg_processed.csv
  - data/source_labels/rosetta/random1000/random_2mut_4idl_1000_with_ddg_processed.csv
  - data/source_labels/rosetta/esm1000/esm2_650M_2muts_1mel_100000_top1pct_with_ddg_processed.csv
  - data/source_labels/rosetta/esm1000/esm2_650M_2muts_4idl_100000_top1pct_with_ddg_processed.csv

  # Data used for the matched-versus-heterogeneous MD comparison and controls.
  - data/md/nanobody_qvalue_400K.csv
  - data/md/nanobody_qvalue_hphil_400K.csv
  - data/md/study_qvalue_fep400k_1mel.csv
  - data/md/study_qvalue_fep400k_4idl.csv
  - paper/analysis/supplementary/tables/candidate_validation.tsv
  - results/source_screen/final_source_screen_summary.json
  - results/source_screen/final_frozen_core_summary.json
  - results/tm_ref_hot_mtl_tmselect/scaling.json
  - results/fep_hot_tmselect_enc3e-5/scaling.json
  - results/final_residual_q_hphil_400k/scaling.json
  - results/sourcefinal_tm_shared_drop0.05/scaling.json
  - results/sourcefinal_md_q-hphil-400k_lr1e-4_enc3e-5/scaling.json
  - results/sourcefinal_frozen_tm_shared_drop0.30/scaling.json
  - results/sourcefinal_frozen_md_q-hphil-400k_drop0.30/scaling.json
  - results/size35_tm_shared_drop005/scaling.json
  - results/size35_ddg_fep_enc3e-5/scaling.json
  - results/size650_tm_shared_drop005/scaling.json
  - results/size650_ddg_fep_enc3e-5/scaling.json

expected_outputs:
  - results/final_tm_frozen/scaling.json
  - results/final_tm_hot/scaling.json
  - results/final_fep_frozen/scaling.json
  - results/final_fep_hot/scaling.json
  - results/final_mdq_frozen/scaling.json
  - results/final_mdq_hot/scaling.json
  - results/final_tmpnn_frozen/scaling.json
  - results/final_tmpnn_hot/scaling.json
  - results/final_ros_frozen/scaling.json
  - results/final_ros_hot/scaling.json
  - results/final_rosrnd_frozen/scaling.json
  - results/final_rosrnd_hot/scaling.json
  - results/final_rosesm_frozen/scaling.json
  - results/final_rosesm_hot/scaling.json
  - results/tuned_rep/frozen_summary.json
  - results/tuned_rep/hot_summary.json
  - results/tuned_rep/Tm_only_frozen/scaling.json
  - results/tuned_rep/Tm_only_hot/scaling.json
  - results/tuned_rep/FEP_frozen/scaling.json
  - results/tuned_rep/FEP_hot/scaling.json
  - results/tuned_rep/MD_FEP400K_frozen/scaling.json
  - results/tuned_rep/MD_FEP400K_hot/scaling.json
  - results/tuned_rep/thermoMPNN_frozen/scaling.json
  - results/tuned_rep/thermoMPNN_hot/scaling.json
  - results/tuned_rep/rosetta_frozen/scaling.json
  - results/tuned_rep/rosetta_hot/scaling.json
  - results/tuned_rep/rosetta_random_frozen/scaling.json
  - results/tuned_rep/rosetta_random_hot/scaling.json
  - results/tuned_rep/rosetta_esm_frozen/scaling.json
  - results/tuned_rep/rosetta_esm_hot/scaling.json
  - paper/tex/figures/figure_1_concept_protocol_v2.png
  - paper/tex/figures/fig_outline02_data_design.pdf
  - paper/tex/figures/fig_outline03_physical_observable.pdf
  - paper/tex/figures/supp_fig02_transfer_controls.pdf
  - paper/analysis/supplementary/MANIFEST.tsv
  - paper/tex/main.pdf
