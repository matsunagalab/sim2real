# Reproduce the selected configurations reported in the current manuscript.
#
# The manuscript has two comparisons and they are produced by two different
# harnesses:
#
#   Fig. 3 (physical observable)  prepare.py, 24-model ensembles, results are
#                                 results/fig3_<SRC>_<regime>/scaling.json with
#                                 the shared baseline results/n24_tm_<regime>_shared
#   Fig. 2 (data design)          scripts/run_design_comparison.py, 8 subset draws
#                                 x 3 seeds, results are
#                                 results/design_{aligned_*,tmonly_*}/design.json
#
# Raw MD, FEP, Rosetta, and FoldX calculations are not launched here; their
# processed tables are fixed inputs. The earlier candidate searches are
# documented in the tracked supplementary tables and are not repeated here.
#
# Older result families that the current manuscript no longer reports
# (results/final_*, results/tuned_rep/*, and the ThermoMPNN label condition) are
# kept in the repository for history but are deliberately NOT part of this
# workflow. Do not add them back: reproducing them does not reproduce the paper.

fixed_inputs:
  # Experimental target split used in this study: 57 train / 114 validation /
  # 396 held-out test examples.
  - data/nbbench/train.csv
  - data/nbbench/val.csv
  - data/nbbench/test.csv

  # Provenance of every processed label table.
  - data/source_labels/MANIFEST.tsv
  - data/source_labels/fep/PROVENANCE.tsv

  # prepare.py validates every manifest row marked used_in_current_manuscript=yes
  # at import time and refuses to start if one of those tables is missing, so the
  # active rows that no reported condition trains on still have to be listed here.
  - data/source_labels/fep/fep1mel_mdmatch_processed.csv
  - data/source_labels/fep/fep4idl_mdmatch_processed.csv
  - data/source_labels/rosetta/measured/1mel_rosettaddg_mdmatch_processed.csv
  - data/source_labels/rosetta/measured/4idl_rosettaddg_mdmatch_processed.csv

  # Fig. 3: the six physical observables on the identical 1MEL/4IDL variant set
  # (421/389), in a common sequence order so every source sees the same subsets.
  - data/source_labels/fig3_matched/FEP_1mel.csv
  - data/source_labels/fig3_matched/FEP_4idl.csv
  - data/source_labels/fig3_matched/MD_1mel.csv
  - data/source_labels/fig3_matched/MD_4idl.csv
  - data/source_labels/fig3_matched/ROS_1mel.csv
  - data/source_labels/fig3_matched/ROS_4idl.csv
  - data/source_labels/fig3_matched/FOLDX_1mel.csv
  - data/source_labels/fig3_matched/FOLDX_4idl.csv

  # Fig. 3: the two Rosetta proposal-design rows use their own native
  # two-mutation variant sets.
  - data/source_labels/rosetta/random1000/random_2mut_1mel_1000_with_ddg_processed.csv
  - data/source_labels/rosetta/random1000/random_2mut_4idl_1000_with_ddg_processed.csv
  - data/source_labels/rosetta/esm1000/esm2_650M_2muts_1mel_100000_top1pct_with_ddg_processed.csv
  - data/source_labels/rosetta/esm1000/esm2_650M_2muts_4idl_100000_top1pct_with_ddg_processed.csv

  # Fig. 2: the aligned-window label pools. run_design_comparison.py reads these
  # through DESIGN_DATA_DIR; the older non-aligned pools under
  # data/source_labels/md_design/ do not reproduce the paper.
  - data/source_labels/md_design_aligned/scan_ownframe0_1mel.csv
  - data/source_labels/md_design_aligned/scan_ownframe0_4idl.csv
  - data/source_labels/md_design_aligned/hetero_backbone_qc.csv

  # Per-variant Q behind the Fig. 2 pools, and the source tables the earlier
  # supporting analyses were built from.
  - data/source_labels/fep/fep1mel_435_processed.csv
  - data/source_labels/fep/fep4idl_409_processed.csv
  - data/source_labels/md_fep400k/1mel_mdq_processed.csv
  - data/source_labels/md_fep400k/4idl_mdq_processed.csv
  - data/source_labels/rosetta/measured/1mel_rosettaddg_processed.csv
  - data/source_labels/rosetta/measured/4idl_rosettaddg_processed.csv
  - data/md/nanobody_qvalue_400K.csv
  - data/md/nanobody_qvalue_hphil_400K.csv
  - data/md/study_qvalue_fep400k_1mel.csv
  - data/md/study_qvalue_fep400k_4idl.csv

  # Supplementary encoder-size control (exploratory fixed configuration).
  - results/size35_tm_shared_drop005/scaling.json
  - results/size35_ddg_fep_enc3e-5/scaling.json
  - results/size650_tm_shared_drop005/scaling.json
  - results/size650_ddg_fep_enc3e-5/scaling.json
  - paper/analysis/supplementary/tables/candidate_validation.tsv

expected_outputs:
  # Fig. 3 baseline and the six physical observables, both encoder regimes.
  - results/n24_tm_frozen_shared/scaling.json
  - results/n24_tm_hot_shared/scaling.json
  - results/fig3_FEP_frozen/scaling.json
  - results/fig3_FEP_hot/scaling.json
  - results/fig3_MD_frozen/scaling.json
  - results/fig3_MD_hot/scaling.json
  - results/fig3_ROS_frozen/scaling.json
  - results/fig3_ROS_hot/scaling.json
  - results/fig3_FOLDX_frozen/scaling.json
  - results/fig3_FOLDX_hot/scaling.json
  - results/fig3_ROSESM_frozen/scaling.json
  - results/fig3_ROSESM_hot/scaling.json
  - results/fig3_ROSRND_frozen/scaling.json
  - results/fig3_ROSRND_hot/scaling.json
  # Fig. 2 baseline and the two data designs, both encoder regimes.
  - results/design_tmonly_frozen/design.json
  - results/design_tmonly_hot/design.json
  - results/design_aligned_scan_pool_frozen/design.json
  - results/design_aligned_scan_pool_hot/design.json
  - results/design_aligned_hetero_frozen/design.json
  - results/design_aligned_hetero_hot/design.json
  # Figures and typeset PDFs.
  - paper/tex/figures/figure_1_concept_protocol_v2.png
  - paper/tex/figures/fig_outline02_data_design.pdf
  - paper/tex/figures/fig_outline03_physical_observable.pdf
  - paper/tex/figures/supp_fig02_transfer_controls.pdf
  - paper/analysis/supplementary/MANIFEST.tsv
  - paper/tex/main.pdf
  - paper/tex/supplementary_main.pdf

stage_order:
  - physical-observable
  - data-design
  - figures

